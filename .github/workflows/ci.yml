name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 前端：lint + 类型 + 单测 ----------
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: web-coverage, path: apps/web/coverage }

  # ---------- 后端：编译 + 单测 + 静态检查 ----------
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -q -B verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: surefire-reports, path: '**/target/surefire-reports' }

  # ---------- 契约：前端类型与后端接口是否漂移 ----------
  contract:
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      # 后端启动后导出 openapi.json，与 packages/shared-types 的定义比对
      - name: Check API contract drift
        run: ./scripts/check-contract.sh
      - if: failure()
        run: echo "::error::后端接口与 shared-types 不一致，请同步类型定义"

  # ---------- 安全：依赖漏洞 + 密钥泄露 ----------
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Detect secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- 汇总：分支保护只勾这一个 ----------
  ci-success:
    needs: [web, backend, security]
    runs-on: ubuntu-latest
    steps:
      - run: echo "所有闸门通过"